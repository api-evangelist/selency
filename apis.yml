aid: selency
name: Selency
description: >-
  Selency is the leading European online marketplace for vintage furniture and
  second-hand home decor. Founded in Paris in 2014 (formerly Brocante Lab), it
  connects individual sellers and professional antique dealers with buyers
  around a curated catalog of more than 300,000 unique pieces: Scandinavian,
  art deco, mid-century, 20th-century and contemporary design, lighting,
  mirrors, rugs and decorative objects. Selency acts as a trusted third party,
  editorially validating each listing and arranging specialized furniture
  delivery across Europe. It is a B Corp certified consumer marketplace with
  French, UK and Netherlands storefronts. No public developer API is offered.
